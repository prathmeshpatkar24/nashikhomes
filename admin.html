<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NashikHomes Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --gold:#C9A84C;--gold-lt:#F0D98B;--gold-dk:#8B6914;
  --dark:#080810;--dark2:#0F0F1A;--dark3:#151522;
  --surf:#1A1A28;--surf2:#212130;--surf3:#28283A;
  --text:#F0EBE0;--text2:#A89F92;--text3:#56524A;
  --bdr:rgba(201,168,76,0.25);--bdr2:rgba(201,168,76,0.1);
  --green:#27AE60;--red:#E74C3C;--blue:#4A90D9;
  --r:12px;--rsm:8px;--rlg:18px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Outfit',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;background:radial-gradient(ellipse at 50% 0%,rgba(201,168,76,.08) 0%,transparent 60%);}
.login-box{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rlg);width:100%;max-width:400px;padding:2.5rem;}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:2rem;justify-content:center;}
.login-logo-mark{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-dk));display:flex;align-items:center;justify-content:center;font-size:1.2rem;}
.login-logo-name{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:700;color:var(--gold);}
.login-logo-name em{color:var(--text);font-style:normal;font-weight:500;}
.login-title{font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:var(--text);text-align:center;margin-bottom:.4rem;}
.login-sub{font-size:.8rem;color:var(--text3);text-align:center;margin-bottom:1.75rem;}
.fg{display:flex;flex-direction:column;gap:6px;margin-bottom:1rem;}
.fg label{font-size:.73rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;}
.fg input{background:var(--surf2);border:1px solid rgba(255,255,255,.08);color:var(--text);font-family:'Outfit',sans-serif;font-size:.875rem;padding:10px 13px;border-radius:var(--rsm);outline:none;transition:border-color .2s;}
.fg input:focus{border-color:var(--gold);}
.err-box{background:rgba(231,76,60,.1);border:1px solid rgba(231,76,60,.3);color:#E74C3C;font-size:.78rem;padding:8px 12px;border-radius:6px;margin-bottom:1rem;display:none;}
.btn-login{background:linear-gradient(135deg,var(--gold),var(--gold-dk));color:var(--dark);font-family:'Outfit',sans-serif;font-size:.9rem;font-weight:700;border:none;padding:11px;border-radius:var(--rsm);cursor:pointer;width:100%;transition:all .2s;margin-top:.5rem;}
.btn-login:hover{filter:brightness(1.1);}
.back-link{display:block;text-align:center;margin-top:1rem;font-size:.78rem;color:var(--text3);text-decoration:none;}
.back-link:hover{color:var(--gold);}

/* ADMIN PANEL */
.adm-wrap{display:none;min-height:100vh;}
.adm-nav{background:var(--dark2);border-bottom:1px solid var(--bdr);padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:62px;}
.adm-nav-logo{display:flex;align-items:center;gap:8px;font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-weight:700;color:var(--gold);}
.adm-nav-logo em{color:var(--text);font-style:normal;font-weight:500;}
.adm-nav-right{display:flex;align-items:center;gap:.75rem;}
.adm-user{font-size:.8rem;color:var(--text2);}
.btn-logout{background:rgba(231,76,60,.1);border:1px solid rgba(231,76,60,.3);color:#E74C3C;font-size:.78rem;font-weight:600;padding:6px 14px;border-radius:6px;cursor:pointer;font-family:'Outfit',sans-serif;}
.btn-logout:hover{background:rgba(231,76,60,.2);}
.btn-home{background:transparent;border:1px solid var(--bdr);color:var(--gold);font-size:.78rem;font-weight:600;padding:6px 14px;border-radius:6px;cursor:pointer;font-family:'Outfit',sans-serif;text-decoration:none;}
.btn-home:hover{background:rgba(201,168,76,.1);}
.adm-body{max-width:980px;margin:0 auto;padding:2rem 1.5rem;}

/* STATS */
.adm-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem;margin-bottom:2rem;}
.stat-card{background:var(--surf);border:1px solid var(--bdr2);border-radius:var(--r);padding:1.25rem;text-align:center;}
.stat-card-num{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:700;color:var(--gold);line-height:1;}
.stat-card-lbl{font-size:.72rem;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-top:4px;}

/* TABS */
.adm-tabs{display:flex;border-bottom:1px solid var(--bdr2);margin-bottom:1.5rem;}
.adm-tab{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text2);font-family:'Outfit',sans-serif;font-size:.875rem;font-weight:600;padding:10px 20px;cursor:pointer;transition:all .2s;}
.adm-tab.active{color:var(--gold);border-bottom-color:var(--gold);}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.form-grid .full{grid-column:1/-1;}
.fg2{display:flex;flex-direction:column;gap:6px;margin-bottom:.85rem;}
.fg2 label{font-size:.73rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;}
.fg2 input,.fg2 select,.fg2 textarea{background:var(--surf2);border:1px solid rgba(255,255,255,.08);color:var(--text);font-family:'Outfit',sans-serif;font-size:.875rem;padding:9px 13px;border-radius:var(--rsm);outline:none;transition:border-color .2s;}
.fg2 input:focus,.fg2 select:focus,.fg2 textarea:focus{border-color:var(--gold);}
.fg2 select option{background:var(--dark2);}
.fg2 textarea{resize:vertical;min-height:80px;}
.img-preview{width:100%;height:140px;border-radius:var(--rsm);object-fit:cover;margin-top:6px;border:1px solid var(--bdr2);display:none;background:var(--surf2);}

/* BUTTONS */
.btn-add{background:linear-gradient(135deg,var(--gold),var(--gold-dk));color:var(--dark);font-family:'Outfit',sans-serif;font-size:.875rem;font-weight:700;border:none;padding:10px 26px;border-radius:var(--rsm);cursor:pointer;transition:all .2s;}
.btn-add:hover{filter:brightness(1.1);}
.btn-add:disabled{opacity:.5;cursor:not-allowed;}
.btn-can{background:transparent;color:var(--text2);font-family:'Outfit',sans-serif;font-size:.875rem;font-weight:600;border:1px solid rgba(255,255,255,.1);padding:10px 24px;border-radius:var(--rsm);cursor:pointer;}

/* LISTINGS */
.prop-list{display:flex;flex-direction:column;gap:.75rem;}
.prop-item{background:var(--surf);border:1px solid var(--bdr2);border-radius:var(--r);padding:1rem 1.25rem;display:flex;align-items:center;gap:1rem;transition:border-color .2s;}
.prop-item:hover{border-color:var(--bdr);}
.prop-img{width:60px;height:60px;border-radius:8px;object-fit:cover;background:var(--surf2);flex-shrink:0;font-size:1.5rem;display:flex;align-items:center;justify-content:center;}
.prop-info{flex:1;}
.prop-title{font-weight:600;font-size:.9rem;color:var(--text);}
.prop-sub{font-size:.76rem;color:var(--text2);margin-top:3px;}
.prop-badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-top:4px;}
.badge-rent{background:rgba(10,35,20,.9);color:#2ECC71;border:1px solid rgba(46,204,113,.3);}
.badge-sale{background:rgba(35,10,10,.9);color:#FF7675;border:1px solid rgba(255,118,117,.3);}
.badge-rented,.badge-sold{background:rgba(20,20,20,.9);color:#A89F92;border:1px solid rgba(168,159,146,.3);}
.prop-actions{display:flex;gap:.5rem;flex-shrink:0;flex-wrap:wrap;}
.btn-edit{background:rgba(74,144,217,.1);border:1px solid rgba(74,144,217,.3);color:var(--blue);font-size:.75rem;font-weight:600;padding:5px 13px;border-radius:6px;cursor:pointer;font-family:'Outfit',sans-serif;}
.btn-edit:hover{background:rgba(74,144,217,.2);}
.btn-del{background:rgba(231,76,60,.1);border:1px solid rgba(231,76,60,.3);color:#E74C3C;font-size:.75rem;font-weight:600;padding:5px 13px;border-radius:6px;cursor:pointer;font-family:'Outfit',sans-serif;}
.btn-del:hover{background:rgba(231,76,60,.2);}
.btn-status{background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.3);color:var(--gold);font-size:.75rem;font-weight:600;padding:5px 13px;border-radius:6px;cursor:pointer;font-family:'Outfit',sans-serif;}
.btn-status:hover{background:rgba(201,168,76,.2);}

/* STATUS DROPDOWN */
.status-dd{position:relative;display:inline-block;}
.status-menu{position:absolute;top:100%;right:0;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rsm);min-width:160px;z-index:100;display:none;box-shadow:0 8px 20px rgba(0,0,0,.4);margin-top:4px;}
.status-menu.open{display:block;}
.status-opt{display:block;width:100%;background:transparent;border:none;color:var(--text2);font-family:'Outfit',sans-serif;font-size:.8rem;padding:8px 14px;cursor:pointer;text-align:left;transition:all .2s;}
.status-opt:hover{background:var(--surf2);color:var(--text);}

/* SPINNER */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.3);border-top-color:#080810;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
.toast{position:fixed;bottom:2rem;right:2rem;background:var(--surf);border:1px solid var(--bdr);color:var(--text);font-size:.875rem;padding:10px 20px;border-radius:var(--rsm);z-index:999;display:none;box-shadow:0 12px 40px rgba(0,0,0,.6);}
.toast.show{display:block;animation:fiu .3s ease;}
@keyframes fiu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.empty-state{text-align:center;padding:3rem;color:var(--text2);}
.settings-wrap{max-width:480px;}

@media(max-width:600px){
  .form-grid{grid-template-columns:1fr;}
  .prop-item{flex-wrap:wrap;}
  .prop-actions{width:100%;}
}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- ===== LOGIN PAGE ===== -->
<div class="login-wrap" id="login-page">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-mark">🏠</div>
      <div class="login-logo-name">Nashik<em>Homes</em></div>
    </div>
    <div class="login-title">Admin Panel</div>
    <div class="login-sub">Sign in to manage your listings</div>
    <div class="err-box" id="login-err"></div>
    <div class="fg"><label>Email</label><input type="email" id="login-email" placeholder="admin@nashikhomes.in" onkeydown="if(event.key==='Enter')doLogin()"/></div>
    <div class="fg"><label>Password</label><input type="password" id="login-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/></div>
    <button class="btn-login" id="login-btn" onclick="doLogin()">Sign In to Admin</button>
    <a class="back-link" href="/">← Back to NashikHomes</a>
  </div>
</div>

<!-- ===== ADMIN PANEL ===== -->
<div class="adm-wrap" id="adm-wrap">
  <div class="adm-nav">
    <div class="adm-nav-logo">🏠 Nashik<em>Homes</em> <span style="font-size:.7rem;color:var(--text3);margin-left:6px;font-family:'Outfit',sans-serif;">Admin</span></div>
    <div class="adm-nav-right">
      <span class="adm-user" id="adm-user-email"></span>
      <a class="btn-home" href="/">← Website</a>
      <button class="btn-logout" onclick="doLogout()">Sign Out</button>
    </div>
  </div>

  <div class="adm-body">
    <!-- Stats -->
    <div class="adm-stats">
      <div class="stat-card"><div class="stat-card-num" id="s-total">—</div><div class="stat-card-lbl">Total</div></div>
      <div class="stat-card"><div class="stat-card-num" id="s-rent">—</div><div class="stat-card-lbl">For Rent</div></div>
      <div class="stat-card"><div class="stat-card-num" id="s-sale">—</div><div class="stat-card-lbl">For Sale</div></div>
      <div class="stat-card"><div class="stat-card-num" id="s-active">—</div><div class="stat-card-lbl">Active</div></div>
    </div>

    <!-- Tabs -->
    <div class="adm-tabs">
      <button class="adm-tab active" onclick="aTab('add')" id="at-add">➕ Add Property</button>
      <button class="adm-tab" onclick="aTab('listings')" id="at-listings">📋 Manage Listings</button>
      <button class="adm-tab" onclick="aTab('settings')" id="at-settings">⚙️ Settings</button>
    </div>

    <!-- ===== ADD / EDIT PROPERTY ===== -->
    <div id="tab-add">
      <div class="form-grid">

        <!-- Property Title -->
        <div class="fg2 full">
          <label>Property Title *</label>
          <input type="text" id="f-title" placeholder="e.g. Road Front Shop for Rent in Nashik Road"/>
        </div>

        <!-- Category — Flat / Shop / Villa etc -->
        <div class="fg2">
          <label>Category *</label>
          <select id="f-category" onchange="onCategoryChange()">
            <option value="flat">🏢 Flat / Apartment</option>
            <option value="bunglow">🏠 Bunglow</option>
            <option value="rowhouse">🏘️ Row House</option>
            <option value="villa">🏡 Villa</option>
            <option value="plot">🌿 Plot / Land</option>
            <option value="shop">🏪 Shop / Showroom</option>
            <option value="office">🏬 Office Space</option>
            <option value="warehouse">🏭 Warehouse / Godown</option>
            <option value="other">📦 Other</option>
          </select>
        </div>

        <!-- Rent / Sale -->
        <div class="fg2">
          <label>Type *</label>
          <select id="f-type">
            <option value="rent">For Rent</option>
            <option value="sale">For Sale</option>
          </select>
        </div>

        <!-- Price -->
        <div class="fg2">
          <label>Price (₹) *</label>
          <input type="number" id="f-price" placeholder="12000"/>
        </div>

        <!-- BHK — sirf residential ke liye -->
        <div class="fg2" id="bhk-wrap">
          <label>BHK</label>
          <select id="f-bhk">
            <option value="1">1 BHK</option>
            <option value="2">2 BHK</option>
            <option value="3">3 BHK</option>
            <option value="4">4+ BHK</option>
          </select>
        </div>

        <!-- Area -->
        <div class="fg2">
          <label>Area (sq.ft)</label>
          <input type="number" id="f-area" placeholder="850"/>
        </div>

        <!-- Location -->
        <div class="fg2 full">
          <label>Area / Location *</label>
          <input type="text" id="f-location" placeholder="e.g. Nashik Road, Nashik (full address mat daalna!)"/>
        </div>

        <!-- Bathrooms — plot/warehouse ke liye hide -->
        <div class="fg2" id="bath-wrap">
          <label>Bathrooms</label>
          <select id="f-bath">
            <option>1</option><option>2</option><option>3</option><option>4</option>
          </select>
        </div>

        <div class="fg2">
          <label>Parking</label>
          <select id="f-parking"><option>Yes</option><option>No</option></select>
        </div>

        <!-- Furnishing — plot ke liye hide -->
        <div class="fg2" id="furnish-wrap">
          <label>Furnishing</label>
          <select id="f-furnish">
            <option>Fully Furnished</option>
            <option>Semi Furnished</option>
            <option>Unfurnished</option>
          </select>
        </div>

        <div class="fg2">
          <label>Contact (WhatsApp)</label>
          <input type="text" id="f-contact" placeholder="919XXXXXXXXX"/>
        </div>

        <!-- Image -->
        <div class="fg2 full">
          <label>Image URL</label>
          <input type="text" id="f-img" placeholder="https://..." oninput="previewImg()"/>
          <img id="img-preview" class="img-preview" alt="Preview"/>
          <small style="color:var(--text3);font-size:.72rem;margin-top:4px;">
            💡 ImgBB.com pe apni photo upload karo aur "Direct link" paste karo
          </small>
        </div>

        <div class="fg2 full">
          <label>Description</label>
          <textarea id="f-desc" placeholder="Property ke baare mein likho — nearby landmarks, special features..."></textarea>
        </div>

      </div>
      <div style="display:flex;gap:.75rem;margin-top:.5rem;">
        <button class="btn-add" id="f-sub-btn" onclick="submitProp()">➕ Add Property</button>
        <button class="btn-can" id="f-can-btn" onclick="resetForm()" style="display:none;">✕ Cancel Edit</button>
      </div>
      <p id="form-status" style="font-size:.78rem;color:var(--text2);margin-top:.75rem;"></p>
    </div>

    <!-- ===== MANAGE LISTINGS ===== -->
    <div id="tab-listings" style="display:none;">
      <div class="prop-list" id="prop-list">
        <div class="empty-state">⏳ Loading properties...</div>
      </div>
    </div>

    <!-- ===== SETTINGS ===== -->
    <div id="tab-settings" style="display:none;">
      <div class="settings-wrap">
        <div class="fg2">
          <label>Default WhatsApp Number</label>
          <input type="text" id="s-wa" placeholder="919XXXXXXXXX"/>
          <small style="color:var(--text3);font-size:.72rem;">Country code ke saath likho, e.g. 919876543210</small>
        </div>
        <div class="fg2">
          <label>Brand Name</label>
          <input type="text" id="s-brand" placeholder="NashikHomes"/>
        </div>
        <button class="btn-add" onclick="saveSettings()" style="margin-top:.5rem;">💾 Save Settings</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== STATUS DROPDOWN (outside) ===== -->
<div id="status-menu" class="status-menu">
  <button class="status-opt" onclick="setStatus('active')">🟢 Active (Available)</button>
  <button class="status-opt" onclick="setStatus('rented')">🔵 Rented</button>
  <button class="status-opt" onclick="setStatus('sold')">⚫ Sold</button>
</div>

<!-- ===== FIREBASE ===== -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import {
  getFirestore, collection, addDoc, updateDoc, deleteDoc, doc,
  onSnapshot, query, orderBy, serverTimestamp
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyCcC7bl2xSTYPgxGqeaA9p_LHN-jg_e-6s",
  authDomain: "nashikhomes-7d9bc.firebaseapp.com",
  projectId: "nashikhomes-7d9bc",
  storageBucket: "nashikhomes-7d9bc.firebasestorage.app",
  messagingSenderId: "203868961078",
  appId: "1:203868961078:web:0f6f7cc80b87b1a11d5b97"
};

// ✅ Sirf yeh email admin hai
const ADMIN_EMAIL = "prathmeshpatkar24@gmail.com";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ---- Expose DB to window so JS functions can use it ----
window._db = db;
window._doc = doc;
window._updateDoc = updateDoc;
window._deleteDoc = deleteDoc;
window._addDoc = addDoc;
window._collection = collection;
window._serverTimestamp = serverTimestamp;

// ---- Real-time listener for properties ----
let unsubscribe = null;

function startListener(){
  if(unsubscribe) unsubscribe(); // pehla listener band karo
  const q = query(collection(db, 'properties'), orderBy('createdAt','desc'));
  unsubscribe = onSnapshot(q, snapshot => {
    window.allProps = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    renderStats();
    if(document.getElementById('tab-listings').style.display !== 'none') renderList();
  });
}

// ---- Auth State ----
onAuthStateChanged(auth, async user => {
  if(user && user.email === ADMIN_EMAIL){
    // ✅ Admin hai
    document.getElementById('login-page').style.display='none';
    document.getElementById('adm-wrap').style.display='block';
    document.getElementById('adm-user-email').textContent=user.email;
    loadSettings();
    startListener();
  } else if(user && user.email !== ADMIN_EMAIL){
    // ❌ Wrong user
    await signOut(auth);
    showError('⛔ Access Denied. You are not authorized.');
  } else {
    document.getElementById('login-page').style.display='flex';
    document.getElementById('adm-wrap').style.display='none';
    if(unsubscribe){ unsubscribe(); unsubscribe=null; }
  }
});

// ---- Login ----
window.doLogin = async function(){
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const btn = document.getElementById('login-btn');
  hideError();
  if(email !== ADMIN_EMAIL){ showError('⛔ Access Denied. You are not authorized.'); return; }
  btn.innerHTML = '<span class="spinner"></span>Signing in...';
  btn.disabled = true;
  try{
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e){
    showError(e.code==='auth/invalid-credential'?'Incorrect email or password.':'Login failed. Try again.');
    btn.innerHTML = 'Sign In to Admin';
    btn.disabled = false;
  }
};

// ---- Logout ----
window.doLogout = async function(){
  await signOut(auth);
  showToast('Signed out.');
};

// ---- Add / Update Property ----
window.submitProp = async function(){
  const title = document.getElementById('f-title').value.trim();
  const price = parseInt(document.getElementById('f-price').value);
  if(!title){ showToast('Property title zaroori hai!'); return; }
  if(!price){ showToast('Price zaroori hai!'); return; }

  const category = document.getElementById('f-category').value;
  const isRes = ['flat','bunglow','rowhouse','villa'].includes(category);
  const isPlot = category==='plot';
  const data = {
    title,
    category,
    type: document.getElementById('f-type').value,
    price,
    bhk: isRes ? document.getElementById('f-bhk').value : null,
    area: parseInt(document.getElementById('f-area').value)||0,
    location: document.getElementById('f-location').value.trim(),
    bath: isPlot ? 0 : parseInt(document.getElementById('f-bath').value)||1,
    parking: document.getElementById('f-parking').value,
    furnish: isPlot ? null : document.getElementById('f-furnish').value,
    contact: document.getElementById('f-contact').value.trim() || window._defWA || '919999999999',
    img: document.getElementById('f-img').value.trim(),
    desc: document.getElementById('f-desc').value.trim(),
    status: 'active',
  };

  const btn = document.getElementById('f-sub-btn');
  const statusEl = document.getElementById('form-status');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Saving...';
  statusEl.textContent = '';

  try{
    if(window._editId){
      // Update
      const ref = window._doc(window._db, 'properties', window._editId);
      delete data.status; // status change na ho edit mein
      await window._updateDoc(ref, { ...data, updatedAt: window._serverTimestamp() });
      showToast('Property updated! ✅');
    } else {
      // Add new
      data.createdAt = window._serverTimestamp();
      await window._addDoc(window._collection(window._db, 'properties'), data);
      showToast('Property added! ✅');
    }
    resetForm();
  } catch(e){
    console.error(e);
    showToast('Error: ' + e.message);
  }
  btn.disabled = false;
  btn.innerHTML = window._editId ? 'Update Property' : '➕ Add Property';
};

// ---- Delete Property ----
window.delProp = async function(id){
  if(!confirm('Yeh property delete karein? Yeh undo nahi ho sakti!')) return;
  try{
    await window._deleteDoc(window._doc(window._db,'properties',id));
    showToast('Property deleted.');
  } catch(e){
    showToast('Delete failed: '+e.message);
  }
};

// ---- Change Status ----
window._statusTarget = null;
window.openStatusMenu = function(id, btn){
  window._statusTarget = id;
  const menu = document.getElementById('status-menu');
  const rect = btn.getBoundingClientRect();
  menu.style.top = (rect.bottom + window.scrollY + 4)+'px';
  menu.style.left = (rect.right - 180 + window.scrollX)+'px';
  menu.style.position = 'absolute';
  menu.classList.add('open');
};
window.setStatus = async function(status){
  const id = window._statusTarget;
  if(!id) return;
  document.getElementById('status-menu').classList.remove('open');
  try{
    await window._updateDoc(window._doc(window._db,'properties',id), { status, updatedAt: window._serverTimestamp() });
    const labels = { active:'Active ✅', rented:'Rented 🔵', sold:'Sold ⚫' };
    showToast('Status updated: '+(labels[status]||status));
  } catch(e){
    showToast('Error: '+e.message);
  }
};
document.addEventListener('click', e => {
  const menu = document.getElementById('status-menu');
  if(!menu.contains(e.target) && !e.target.classList.contains('btn-status'))
    menu.classList.remove('open');
});

function showError(msg){ const el=document.getElementById('login-err'); el.textContent=msg; el.style.display='block'; }
function hideError(){ document.getElementById('login-err').style.display='none'; }
</script>

<!-- ===== ADMIN UI LOGIC ===== -->
<script>
window.allProps = [];
window._editId = null;
window._defWA = '919999999999';

const fp = (p, type) => {
  if(type==='rent') return '₹'+p.toLocaleString('en-IN')+'/mo';
  if(p>=10000000) return '₹'+(p/10000000).toFixed(2)+' Cr';
  if(p>=100000) return '₹'+(p/100000).toFixed(1)+' L';
  return '₹'+p.toLocaleString('en-IN');
};

function loadSettings(){
  try{
    const d=localStorage.getItem('nh2_settings');
    if(d){
      const s=JSON.parse(d);
      window._defWA=s.wa||window._defWA;
      if(s.wa) document.getElementById('s-wa').value=s.wa;
      if(s.brand) document.getElementById('s-brand').value=s.brand;
    }
  }catch(e){}
}

function renderStats(){
  const r=allProps.filter(p=>p.type==='rent').length;
  const s=allProps.filter(p=>p.type==='sale').length;
  const active=allProps.filter(p=>!p.status||p.status==='active').length;
  document.getElementById('s-total').textContent=allProps.length;
  document.getElementById('s-rent').textContent=r;
  document.getElementById('s-sale').textContent=s;
  document.getElementById('s-active').textContent=active;
}

function aTab(tab){
  ['add','listings','settings'].forEach(tt=>{
    document.getElementById('tab-'+tt).style.display=tt===tab?'block':'none';
    document.getElementById('at-'+tt).classList.toggle('active',tt===tab);
  });
  if(tab==='listings') renderList();
}

function renderList(){
  const el=document.getElementById('prop-list');
  if(!allProps.length){
    el.innerHTML='<div class="empty-state">📭 No properties yet. Add your first listing!</div>';
    return;
  }
  el.innerHTML=allProps.map(p=>{
    const statusLabel = p.status==='rented'?'Rented':p.status==='sold'?'Sold':p.type==='rent'?'For Rent':'For Sale';
    const badgeClass = p.status==='rented'?'badge-rented':p.status==='sold'?'badge-sold':'badge-'+p.type;
    return `
    <div class="prop-item">
      ${p.img
        ? `<img class="prop-img" src="${p.img}" onerror="this.outerHTML='<div class=&quot;prop-img&quot;>🏠</div>'" alt="${p.title}"/>`
        : `<div class="prop-img">🏠</div>`}
      <div class="prop-info">
        <div class="prop-title">${CAT_ICON[p.category]||'🏠'} ${p.title}</div>
        <div class="prop-sub">📍 ${p.location||'—'} · ${fp(p.price,p.type)}</div>
        <span class="prop-badge ${badgeClass}">${statusLabel}</span>
      </div>
      <div class="prop-actions">
        <button class="btn-status" onclick="openStatusMenu('${p.id}',this)">🔄 Status</button>
        <button class="btn-edit" onclick="editProp('${p.id}')">✏️ Edit</button>
        <button class="btn-del" onclick="delProp('${p.id}')">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

// Category change hone par BHK/Bath/Furnish show/hide
function onCategoryChange(){
  const cat = document.getElementById('f-category').value;
  const isRes = ['flat','bunglow','rowhouse','villa'].includes(cat);
  const isPlot = cat==='plot';
  document.getElementById('bhk-wrap').style.display = isRes ? 'flex' : 'none';
  document.getElementById('bath-wrap').style.display = isPlot ? 'none' : 'flex';
  document.getElementById('furnish-wrap').style.display = isPlot ? 'none' : 'flex';
}

// Category ke liye emoji
const CAT_ICON = {
  flat:'🏢', bunglow:'🏠', rowhouse:'🏘️', villa:'🏡',
  plot:'🌿', shop:'🏪', office:'🏬', warehouse:'🏭', other:'📦'
};

function editProp(id){
  const p=allProps.find(x=>x.id===id);
  if(!p) return;
  window._editId=id;
  document.getElementById('f-title').value=p.title||'';
  document.getElementById('f-category').value=p.category||'flat';
  document.getElementById('f-type').value=p.type||'rent';
  document.getElementById('f-price').value=p.price||'';
  document.getElementById('f-bhk').value=p.bhk||'2';
  document.getElementById('f-area').value=p.area||'';
  document.getElementById('f-location').value=p.location||'';
  document.getElementById('f-bath').value=p.bath||'1';
  document.getElementById('f-parking').value=p.parking||'Yes';
  document.getElementById('f-furnish').value=p.furnish||'Unfurnished';
  document.getElementById('f-contact').value=p.contact||'';
  document.getElementById('f-img').value=p.img||'';
  document.getElementById('f-desc').value=p.desc||'';
  document.getElementById('f-sub-btn').textContent='💾 Update Property';
  document.getElementById('f-can-btn').style.display='inline-block';
  onCategoryChange(); // BHK show/hide update karo
  previewImg();
  aTab('add');
  window.scrollTo({top:0,behavior:'smooth'});
}

function resetForm(){
  ['f-title','f-price','f-area','f-location','f-contact','f-img','f-desc'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value='';
  });
  document.getElementById('f-category').value='flat';
  onCategoryChange(); // reset to default (flat = BHK dikhega)
  window._editId=null;
  document.getElementById('f-sub-btn').textContent='➕ Add Property';
  document.getElementById('f-can-btn').style.display='none';
  document.getElementById('form-status').textContent='';
  const prev=document.getElementById('img-preview');
  if(prev) prev.style.display='none';
}

function previewImg(){
  const url=document.getElementById('f-img').value.trim();
  const prev=document.getElementById('img-preview');
  if(url){ prev.src=url; prev.style.display='block'; prev.onerror=()=>prev.style.display='none'; }
  else prev.style.display='none';
}

function saveSettings(){
  const wa=document.getElementById('s-wa').value.trim();
  const brand=document.getElementById('s-brand').value.trim();
  if(wa) window._defWA=wa;
  localStorage.setItem('nh2_settings',JSON.stringify({wa:window._defWA,brand}));
  showToast('Settings saved! ✅');
}

function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2800);
}
</script>
</body>
